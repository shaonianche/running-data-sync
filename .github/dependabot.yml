version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      # Prefix all commit messages with "npm"
      prefix: npm
    open-pull-requests-limit: 10
    groups:
      # Keep React runtime versions in lockstep (mismatched react/react-dom
      # previously blanked production — see SHA-1 / #1087).
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
      # Optional: major react upgrades still open as a group for review.
      react-major:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - major

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: /
    schedule:
      interval: monthly
    commit-message:
      # Prefix all commit messages with "github-actions"
      prefix: github-actions
