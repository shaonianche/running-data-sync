name: Strava Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
    paths:
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/run-data-sync.yml

env:
  ATHLETE: FRIENDSA
  TITLE: Running
  MIN_GRID_DISTANCE: 5
  TITLE_GRID: Over 5km Runs
  GITHUB_NAME: shaonianche
  GITHUB_EMAIL: github@duanfei.org

  BACKGROUND_COLOR_LIGHT: '#e5e5e5'
  NO_ACTIVITY_COLOR_LIGHT: '#d4d4d4'
  TEXT_COLOR_LIGHT: '#262626'
  TRACK_COLOR_LIGHT: '#525252'
  SPECIAL_COLOR_LIGHT: '#024a70'
  SPECIAL_COLOR2_LIGHT: '#ff8904'
  USE_CLOUDFLARE_WARP: true  # If you want to use Cloudflare WARP to bypass network restrictions, set it to `true`. Currently only Garmin needs this.

concurrency:
  group: strava-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    outputs:
      SAVE_DATA_IN_GITHUB_CACHE: ${{ steps.set_output.outputs.SAVE_DATA_IN_GITHUB_CACHE }}
      DATA_CACHE_PREFIX: ${{ steps.set_output.outputs.DATA_CACHE_PREFIX }}
      BUILD_GH_PAGES: ${{ steps.set_output.outputs.BUILD_GH_PAGES }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set outputs
        id: set_output
        env:
          SAVE_DATA_IN_GITHUB_CACHE: ${{ env.SAVE_DATA_IN_GITHUB_CACHE }}
          DATA_CACHE_PREFIX: ${{ env.DATA_CACHE_PREFIX }}
          BUILD_GH_PAGES: ${{ env.BUILD_GH_PAGES }}
        run: |
          echo "SAVE_DATA_IN_GITHUB_CACHE=$SAVE_DATA_IN_GITHUB_CACHE" >> "$GITHUB_OUTPUT"
          echo "DATA_CACHE_PREFIX=$DATA_CACHE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "BUILD_GH_PAGES=$BUILD_GH_PAGES" >> "$GITHUB_OUTPUT"

      - name: Cache Data Files
        if: steps.set_output.outputs.SAVE_DATA_IN_GITHUB_CACHE == 'true'
        uses: actions/cache@v6
        with:
          path: |
            apps/web/public
            apps/web/src/static/activities.json
          key: ${{ steps.set_output.outputs.DATA_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.set_output.outputs.DATA_CACHE_PREFIX }}-${{ github.sha }}-
            ${{ steps.set_output.outputs.DATA_CACHE_PREFIX }}-

      - name: Install Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          # apt sometimes cannot resolve the Ubuntu mirrors; retry instead of burning the whole run.
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install -y cloudflare-warp; then
              exit 0
            fi
            echo "Installing cloudflare-warp failed (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Connect Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          # `connect` returns before the tunnel is up, so wait for it instead of a fixed sleep.
          for attempt in $(seq 1 30); do
            if warp-cli --accept-tos status 2>&1 | grep -q "Status update: Connected"; then
              break
            fi
            sleep 2
          done
          echo "WARP status:"
          warp-cli --accept-tos status
          warp-cli --accept-tos status 2>&1 | grep -q "Status update: Connected" || {
            echo "Cloudflare WARP did not connect within 60s"
            exit 1
          }
          echo "IP info:"
          curl -s --retry 5 --retry-delay 2 --retry-all-errors https://cloudflare.com/cdn-cgi/trace | grep -E "ip|warp"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Enable corepack / pnpm
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core and CLI packages
        run: pnpm --filter @running-data-sync/core --filter @running-data-sync/cli build

      - name: Pull DuckDB snapshot from private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          DB_PATH="${{ runner.temp }}/data.duckdb"
          echo "RUNNING_DATA_SYNC_DB_PATH=$DB_PATH" >> "$GITHUB_ENV"
          node packages/cli/dist/cli.js db pull --output "$DB_PATH" >/dev/null

      - name: Run sync Strava -> DuckDB
        run: node packages/cli/dist/cli.js sync db --client-id '${{ secrets.S_CLIENT_ID }}' --client-secret '${{ secrets.S_CLIENT_SECRET }}' --refresh-token '${{ secrets.S_REFRESH_TOKEN }}'

      - name: Sync DuckDB -> Garmin COM
        run: node packages/cli/dist/cli.js vendor garmin --secret-string '${{ secrets.GARMIN_SECRET }}'

      - name: Sync DuckDB -> Garmin CN
        run: node packages/cli/dist/cli.js vendor garmin --is-cn --secret-string '${{ secrets.GARMIN_SECRET_CN }}'

      - name: Rebuild derived data from DuckDB
        run: |
          node packages/cli/dist/cli.js data json
          node packages/cli/dist/cli.js data parquet

      - name: Validate exported data consistency
        run: node packages/cli/dist/cli.js data validate

      - name: Check for data changes
        id: data_changes
        run: |
          if git diff --quiet -- \
            apps/web/src/static/activities.json \
            apps/web/public/db/activities.parquet \
            apps/web/public/db/activities_flyby.parquet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new activity data"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "New activity data found"
          fi

      - name: Make svg GitHub profile
        if: steps.data_changes.outputs.has_changes == 'true'
        run: |
          node packages/cli/dist/cli.js svg --from-db --title '${{ env.TITLE }}' --type github --athlete '${{ env.ATHLETE }}' --special-distance 10 --special-distance2 20 --special-color yellow --special-color2 red --min-distance 0.5 --output apps/web/public/assets/github.svg
          node packages/cli/dist/cli.js svg --from-db --title '${{ env.TITLE_GRID }}' --type grid --athlete '${{ env.ATHLETE }}' --min-distance '${{ env.MIN_GRID_DISTANCE }}' --special-color yellow --special-color2 red --special-distance 10 --special-distance2 20 --output apps/web/public/assets/grid.svg
          node packages/cli/dist/cli.js svg --from-db --title '${{ env.TITLE }}' --type github --athlete '${{ env.ATHLETE }}' --special-distance 10 --special-distance2 20 --background-color '${{ env.BACKGROUND_COLOR_LIGHT }}' --no-activity '${{ env.NO_ACTIVITY_COLOR_LIGHT }}' --text-color '${{ env.TEXT_COLOR_LIGHT }}' --track-color '${{ env.TRACK_COLOR_LIGHT }}' --special-color '${{ env.SPECIAL_COLOR_LIGHT }}' --special-color2 '${{ env.SPECIAL_COLOR2_LIGHT }}' --min-distance 0.5 --output apps/web/public/assets/github-light.svg
          node packages/cli/dist/cli.js svg --from-db --title '${{ env.TITLE_GRID }}' --type grid --athlete '${{ env.ATHLETE }}' --min-distance '${{ env.MIN_GRID_DISTANCE }}' --background-color '${{ env.BACKGROUND_COLOR_LIGHT }}' --text-color '${{ env.TEXT_COLOR_LIGHT }}' --track-color '${{ env.TRACK_COLOR_LIGHT }}' --special-color '${{ env.SPECIAL_COLOR_LIGHT }}' --special-color2 '${{ env.SPECIAL_COLOR2_LIGHT }}' --special-distance 10 --special-distance2 20 --output apps/web/public/assets/grid-light.svg

      - name: Push DuckDB snapshot to private R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: node packages/cli/dist/cli.js db push --input "$RUNNING_DATA_SYNC_DB_PATH" >/dev/null

      - name: Disconnect Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          warp-cli --accept-tos disconnect

      - name: Push new runs
        run: |
          if [ "${{ steps.data_changes.outputs.has_changes }}" != "true" ]; then
              echo "No new activity data, skip commit"
              exit 0
          fi
          for path in \
            apps/web/src/static/activities.json \
            apps/web/public/assets/github.svg \
            apps/web/public/assets/grid.svg \
            apps/web/public/assets/github-light.svg \
            apps/web/public/assets/grid-light.svg \
            apps/web/public/db/activities.parquet \
            apps/web/public/db/activities_flyby.parquet; do
            if [ -e "$path" ] || git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add "$path"
            fi
          done
          node scripts/check-private-data-leak.mjs --staged
          if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "sync running data $(date +'%Y-%m-%d')"
          git pull --rebase --autostash origin ${{ github.ref }}
          git push

  publish_github_pages:
    # Only deploy production GitHub Pages on the default branch so manual
    # workflow_dispatch runs on dev-v2 remain isolated from production.
    if: needs.sync.result == 'success' && github.ref == 'refs/heads/main'
    name: Build and publish Github Pages
    uses: ./.github/workflows/gh-pages.yml
    with:
      save_data_in_github_cache: ${{ needs.sync.outputs.SAVE_DATA_IN_GITHUB_CACHE == 'true' }}
      data_cache_prefix: ${{ needs.sync.outputs.DATA_CACHE_PREFIX }}
    needs:
      - sync
